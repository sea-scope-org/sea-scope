# Watch console — session watch board + live sessionUpdates stream.
# Fragments are the single source of truth for WatchState fields on the client.

fragment WatchFields on WatchState {
    scenarioId
    title
    description
    status
    simMs
    centerLat
    centerLon
    zoom
    selectedMmsi
    dataSources {
        id
        enabled
        status
        vesselCount
    }
    vessels {
        mmsi
        name
        imo
        shipType
        flag
        aisDark
        dataSource
        riskScore
        riskLevel
        riskTrend
        nearestAssetId
        nearestAssetDistanceNm
        activeFactors {
            rule
            scoreDelta
            explanation
            source
        }
        trackTail {
            lat
            lon
        }
        radarPosition {
            lat
            lon
        }
        position {
            lat
            lon
            sog
            cog
            heading
            timestamp
        }
    }
    anomalies {
        anomalyId
        mmsi
        kind
        severity
        title
        summary
        detectedAtSimMs
        evidence
    }
    riskEvents {
        riskEventId
        mmsi
        detectedAtSimMs
        rule
        scoreDelta
        previousScore
        newScore
        explanation
        source
    }
    incidents {
        incidentId
        mmsi
        openedAtSimMs
        closedAtSimMs
        maxRiskScore
        status
        timeline {
            eventId
            detectedAtSimMs
            eventType
            source
            explanation
            riskChange
        }
    }
    osintAlerts {
        alertId
        source
        title
        body
        region
    }
}

query WatchPage {
    currentSession {
        sessionId
        watch {
            ...WatchFields
        }
        scenarios {
            scenarioId
            title
            description
        }
    }
}

mutation VesselSelect($mmsi: ID) {
    session {
        vesselSelect(mmsi: $mmsi) {
            ...WatchFields
        }
    }
}

mutation VesselIntelligenceRequest($mmsi: ID!) {
    session {
        vesselIntelligenceRequest(mmsi: $mmsi) {
            success
            referenceId
        }
    }
}

mutation AlertAcknowledge($incidentId: ID!) {
    session {
        alertAcknowledge(incidentId: $incidentId) {
            ...WatchFields
        }
    }
}

mutation ScenarioReset {
    session {
        scenarioReset {
            ...WatchFields
        }
    }
}

mutation MockAisSetEnabled($enabled: Boolean!) {
    session {
        mockAisSetEnabled(enabled: $enabled) {
            ...WatchFields
        }
    }
}

mutation AisViewportReport($southLat: Float!, $westLon: Float!, $northLat: Float!, $eastLon: Float!) {
    session {
        aisViewportReport(southLat: $southLat, westLon: $westLon, northLat: $northLat, eastLon: $eastLon) {
            success
            referenceId
        }
    }
}

mutation AisViewportClear {
    session {
        aisViewportClear {
            success
            referenceId
        }
    }
}

subscription SessionUpdates {
    sessionUpdates {
        __typename
        ... on SessionUpdateWatchSnapshot {
            watch {
                ...WatchFields
            }
        }
        ... on SessionUpdateAnomalyAppended {
            anomaly {
                anomalyId
                mmsi
                kind
                severity
                title
                summary
                detectedAtSimMs
                evidence
            }
        }
        ... on SessionUpdateIntelligence {
            intelligence {
                mmsi
                vesselName
                status
                summary
                whyFlagged
                citations {
                    label
                    source
                }
                playbookSteps
                generatedAt
                complete
            }
        }
    }
}
