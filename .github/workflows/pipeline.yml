name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit lint
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint commits (PR)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint commits (push)
        if: github.event_name == 'push'
        run: |
          if ! git cat-file -e ${{ github.event.before }}^{commit} 2>/dev/null; then
            echo "Base commit not found (new branch or force push) — skipping commitlint"
            exit 0
          fi
          npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

  codegen:
    name: Codegen freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: GraphQL codegen
        run: npm run graphql:generate

      - name: DB codegen
        run: npm run db:generate

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code -- '*.gen.ts' '*.generated.ts' 'drizzle/'
          if [ -n "$(git ls-files --others --exclude-standard -- '*.gen.ts' '*.generated.ts' 'drizzle/')" ]; then
            echo "Untracked generated files present — codegen output is not committed"
            exit 1
          fi

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Spell
        run: npm run spell:check

      - name: Types
        run: npm run type:check

      - name: Usage
        run: npm run usage:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      sessionCookieName: test-session
      WEB_PAGE_URL: http://localhost:3000
      VISITOR_IP_HASH_SALT: test-salt
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Run migrations
        run: npm run db:push

      - name: Test
        run: npm test

  migrations-check:
    name: Migrations applied (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        env: [prod, preview]
    env:
      DB_LABEL: ${{ matrix.env }}
      DATABASE_URL: ${{ matrix.env == 'prod' && secrets.DATABASE_URL_PROD || secrets.DATABASE_URL_PREVIEW }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Check migrations applied
        run: npm run db:check-applied
